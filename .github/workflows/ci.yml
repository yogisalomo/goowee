name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      # Allocation-budget tests are tagged !race (the detector perturbs alloc
      # counts), so they don't run above — run them in a dedicated non-race step.
      - name: Allocation budgets
        run: go test -run 'AllocBudget' -count=1 ./core/ ./internal/dom/

      - name: Build (native)
        run: go build ./...

      # The analyzer's own tests, then goowee's rules on the examples and the
      # tutorial, which must have zero findings (#147).
      - name: gooweevet
        run: |
          (cd tools/gooweevet && go vet ./... && go test ./...)
          make gooweevet

      - name: Build SSR server
        run: go build -o /tmp/ssr-server ./cmd/ssr-server

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Brotli bytes of the smallest app and the example site against
      # docs/perf/size-budget.json (+3%), plus each program's deny list; the
      # log shows the code bytes per package (#129).
      - name: WASM size budget
        run: make size-check

      - name: Benchmarks (smoke)
        run: go test -run '^$' -bench . -benchtime=10x ./core/ ./internal/dom/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # global WebSocket/fetch — no npm deps in the harness
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      # run.sh pre-compresses main.wasm when the brotli CLI is present, so the
      # browser boots from the br-encoded copy the SSR server serves.
      - name: brotli CLI
        run: command -v brotli || (sudo apt-get update -qq && sudo apt-get install -y -qq brotli)

      # Builds the WASM app + SSR server, serves it, and drives the real app in
      # headless Chrome (hydration, interactivity, routing/history, refs, async,
      # error boundary, off-loop stopwatch) plus the devtools inspector checks,
      # and goowee/net (fetch + WebSocket) against a real server.
      - name: E2E (headless Chrome)
        run: make e2e
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}

      # The deployed artifact: the Pages build under its /goowee/ base path.
      - name: E2E — GitHub Pages build
        run: make pages-e2e
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}

  # TinyGo as a supported target (#128): build the example with TinyGo, check
  # its size against docs/perf/size-budget.json, and run the smoke and
  # devtools E2E against it with TinyGo's own wasm_exec.js.
  tinygo:
    runs-on: ubuntu-latest
    env:
      TINYGO_VERSION: '0.44.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: TinyGo
        run: |
          wget -q "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb"
          sudo dpkg -i "tinygo_${TINYGO_VERSION}_amd64.deb"
          tinygo version
      - name: TinyGo size budget
        run: make size-check-tinygo
      - name: E2E on the TinyGo build (headless Chrome)
        run: ./test/e2e/tinygo.sh
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
