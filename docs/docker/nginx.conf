server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any path that doesn't match a file.
    # This is required because goowee reads window.location.pathname at boot —
    // without it, direct navigation to deep links (e.g. /todos/42) returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (they're content-hashed or versioned).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WASM needs correct MIME type. nginx serves application/wasm by default,
    # but being explicit prevents confusion.
    location ~* \.wasm$ {
        application/wasm;
    }
}
