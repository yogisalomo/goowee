# Reference nginx config for serving a goowee app (an SPA). Copy and adapt it
# for your own project — it pairs with the sample Dockerfile in this directory.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any path that doesn't match a file.
    # Required because goowee reads window.location.pathname at boot — without
    # it, direct navigation to a deep link (e.g. /todos/42) returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep the app shell uncached so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache built assets. goowee's default output uses fixed filenames
    # (main.wasm, goowee.js, wasm_exec.js), so do NOT mark them immutable — a
    # redeploy reuses the same names and clients would keep the stale copy. If
    # you content-hash your asset filenames, raise this to
    # `expires 1y; add_header Cache-Control "public, immutable";`.
    location ~* \.(?:wasm|js|css|png|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # No explicit .wasm MIME type is needed: nginx:alpine already maps
    # .wasm -> application/wasm via its bundled mime.types (nginx >= 1.21.4).
}
